name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a release? (yes/no)'
        required: true
        default: 'no'
      version:
        description: 'Version tag (e.g. v0.1.0). Leave empty to use debian/changelog version.'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          tags: build-image
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save container image
        run: docker save build-image | zstd -T0 -o image.tar.zst

      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: build-image
          path: image.tar.zst
          retention-days: 1

  lint:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download container image
        uses: actions/download-artifact@v8
        with:
          name: build-image

      - name: Load container image
        run: zstd -d image.tar.zst -o image.tar && docker load < image.tar

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run linters in container
        run: |
          docker run --rm \
            -v $(pwd):/app \
            build-image \
            bash -c "npm ci && npm run lint && npm run format:check && shellcheck build.sh scripts/*.sh"

  build:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download container image
        uses: actions/download-artifact@v8
        with:
          name: build-image

      - name: Load container image
        run: zstd -d image.tar.zst -o image.tar && docker load < image.tar

      - name: Checkout
        uses: actions/checkout@v7

      # the private half of the crx key signs the archive, its public half is
      # pinned in the manifest and pack-crx.js refuses a mismatch
      - name: Provide CRX key
        env:
          CHROME_CRX_KEY: ${{ secrets.CHROME_CRX_KEY }}
        run: |
          if [ -z "${CHROME_CRX_KEY}" ]; then
            echo "::error::CHROME_CRX_KEY secret is missing, the chrome package cannot be signed"
            exit 1
          fi
          printf '%s\n' "${CHROME_CRX_KEY}" > crx-key.pem
          chmod 600 crx-key.pem

      # dpkg-buildpackage writes next to the source tree rather than into it,
      # so it builds from a copy and the packages are carried back explicitly
      - name: Build packages in container
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -e CRX_KEY=/tmp/build/src/crx-key.pem \
            build-image \
            bash -c '
              set -e
              mkdir -p /tmp/build/src
              cp -a /app/. /tmp/build/src/
              rm -rf /tmp/build/src/node_modules /tmp/build/src/.git
              cd /tmp/build/src
              dpkg-buildpackage -us -uc -b
              lintian --fail-on error,warning /tmp/build/*.changes
              mkdir -p /app/packages
              cp /tmp/build/*.deb /app/packages/
            '
          sudo chown -R "$(id -u):$(id -g)" packages

      - name: Drop CRX key
        if: always()
        run: rm -f crx-key.pem

      - name: Inspect and test install
        run: |
          for deb in packages/*.deb; do
            echo "=== ${deb} ==="
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
            sudo dpkg -i "$deb" || sudo apt-get -f install -y
          done

      - name: Verify installed files
        run: |
          test -f /usr/share/gnome-shell/extensions/xiws@xi72yow/extension.js
          test -f /usr/share/glib-2.0/schemas/org.gnome.shell.extensions.xiws.gschema.xml
          test -f /usr/share/xi-extensions/xiws.crx
          test -f /usr/share/google-chrome/extensions/joljhccfdnpdncplopfkfdhpdlfpdhap.json
          echo "installed as expected"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages/*.deb
          retention-days: 7

  release:
    needs: [lint, build]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'yes'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            BASE="${{ github.event.inputs.version }}"
          else
            VERSION=$(dpkg-parsechangelog -l debian/changelog -S Version)
            BASE="v${VERSION}"
          fi

          git fetch --tags
          LATEST_TAG=$(git tag -l "${BASE}-*" --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT_REV=$(echo "$LATEST_TAG" | sed "s/${BASE}-//")
            NEW_REV=$((CURRENT_REV + 1))
          else
            if git rev-parse "${BASE}" >/dev/null 2>&1; then
              NEW_REV=2
            else
              NEW_REV=1
            fi
          fi

          TAG="${BASE}-${NEW_REV}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      - name: Update APT repository
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils
          ./scripts/update-repo.sh

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: packages/*.deb
          generate_release_notes: true

      - name: Upload repo artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo/

  deploy-pages:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
